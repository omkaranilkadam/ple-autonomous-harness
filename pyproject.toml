[project]
name = "ple-submission"
version = "0.1.0"
description = "PLE-2026 Agent Harness for Physical-Engineering's Last Exam"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "websockets>=12.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
pdf = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
]
ifc = [
    "ifcopenshell>=0.7.0",
]
science = [
    "pint>=0.23",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

